function overview(){let m=D.metrics,open=S.orders.filter(x=>x.status==='Order Placed'),low=D.planning.filter(x=>x.suggested),running=S.production.filter(x=>x.status==='In Progress'),recent=S.orders.slice(0,5),months=Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);let key=d.toISOString().slice(0,7);return {label:d.toLocaleDateString('en-US',{month:'short'}),sum:S.sales.filter(x=>x.date.startsWith(key)).reduce((a,x)=>a+x.revenue,0)}}),max=Math.max(...months.map(x=>x.sum),1);return head('A clear view of what’s moving.','Your workshop, warehouse, and customers. All in one place.',btn('＋ New sales order',"openModal('order')",'primary'))+'<div class="banner"><div><b>Good things are taking shape.</b><span style="color:#829175;margin-left:8px">You have '+open.length+' orders to fulfill and '+low.length+' items to review.</span></div>'+link('Review material plan','mrp')+'</div>'+stats([['Net revenue',money(m.revenue),'Recorded history · live ledger'],['Inventory value',money(m.value),'Across '+S.locations.length+' locations'],['Open sales orders',int(open.length),'Confirmed customer demand'],['Production in progress',int(running.length),'Active work orders']])+'<div class="grid">'+panel('Revenue overview','A little progress, every month.','<div class="panelbody"><div style="display:flex;justify-content:space-between"><div><span class="eyebrow">LAST SIX MONTHS</span><div style="font-size:25px;margin-top:5px">'+money(m.revenue)+'</div></div><span class="badge">● Sales revenue</span></div><div class="chart">'+months.map(x=>'<div class="barcol"><div class="bar" title="'+money(x.sum)+'" style="height:'+Math.max(2,x.sum/max*100)+'%"></div><label>'+x.label+'</label></div>').join('')+'</div><div class="chartfoot"><span>Revenue after discounts and returns</span>'+link('Financial reports','financials')+'</div></div>')+panel('Needs your attention','Small actions that keep things moving.','<div class="panelbody"><div class="listrow"><div><h3>Mate  if(kind==='adjust'){title='Receive / adjust inventory';submit='Post adjustment';content=scanField()+itemField()+locationField()+field('qty','Quantity change (+ receive / − reduce)',inp('qty','number',1,'step="1" required'))+field('reason','Reason code',select('reason',['Cycle count','Damage','Quality failure','Supplier receipt']))+'<div class="info full">Use PO receiving for purchased inventory to keep supplier scorecards accurate. Positive non-PO adjustments use the current average cost.</div>';}
 if(kind==='production'){title='Create work order';submit='Create planned order';content=itemField(S.items.filter(x=>x.bom.length))+locationField()+quantityField(10);}
 if(kind==='complete'){x=S.production.find(x=>x.id===id);title='Complete '+esc(id);submit='Receive finished goods';content='<div class="info full">'+esc(it(x.item).name)+' · '+x.qty+' units started. Good + scrap must equal started. Reworked units are included in good.</div>'+field('good','Completed good',inp('good','number',x.qty,'min="0" step="1" required'))+field('scrap','Scrapped',inp('scrap','number',0,'min="0" step="1" required'))+field('rework','Reworked (subset of good)',inp('rework','number',0,'min="0" step="1" required'))+field('reason','Quality reason code',select('reason',[['','No quality issue'],'Seam failure','Fabric defect','Cutting error','Machine issue','Rework completed']));}
 if(kind==='return'){title='Return / exchange';submit='Process return / exchange';const sales=S.sales.filter(x=>x.kind==='sale');x=sales[0];content=field('sale','Original sale',select('sale',sales.map(x=>[x.id,x.id+' · '+x.date+' · '+money(x.revenue)]),x?.id,'onchange="returnItems()"'),'full')+field('item','Item to return',select('item',itemOpts(x?x.lines.map(l=>it(l.item)):[])))+quantityField()+locationField()+field('reason','Return / quality reason',select('reason',['Changed mind','Wrong item','Seam failure','Fabric defect','Damaged']))+field('exchangeItem','Exchange for (optional)',select('exchangeItem',[['','Refund only'],...itemOpts()]),'full')+'<div class="info full">Quality failures are logged in quarantine, not sellable inventory. An exchange posts a reversal plus a replacement sale; any price difference is shown in the result.</div>';}
 if(kind==='po'){title='Create purchase order';submit='Create PO & open send draft';poSupplier=S.suppliers[0].id;cart=[{item:S.items.find(x=>x.supplier===poSupplier).id,qty:25}];content=field('supplier','Supplier',select('supplier',S.suppliers.map(x=>[x.id,x.name]),poSupplier,'onchange="poSupplier=this.value;cart=[];poAddLine();updatePOExpected()"'))+locationField()+'<div id="poexpected" class="info full">Expected receipt: '+addDays(date(),sup(poSupplier).lead)+'</div><div id="pocart" class="full">'+poCart()+'</div>';}
 if(kind==='receive'){x=S.pos.find(x=>x.id===id);title='Receive against '+esc(id);submit='Record receipt';content='<div class="info full">Expected '+x.expected+' · Today '+date()+' · '+(date()<=x.expected?'On time':'Late')+'</div>'+scanField()+itemField(x.lines.filter(l=>l.received<l.qty).map(l=>it(l.item)))+field('location','Receive into',select('location',locOpts(),x.location))+quantityField();}
 if(kind==='pay'){x=S.pos.find(x=>x.id===id);title='Record supplier payment';submit='Record payment';content='<div class="info full">'+esc(id)+' · Due '+addDays(x.invoiceDate,sup(x.supplier).terms)+'</div>'+field('amount','Amount paid ($)',inp('amount','number',Math.max(0,x.lines.reduce((a,l)=>a+l.received*l.cost,0)-x.paid).toFixed(2),'min="0.01" step="0.01" required'),'full');}
 if(kind==='supplier'){x=S.suppliers.find(x=>x.id===id)||{};title=x.id?'Edit supplier':'Add supplier';content=field('name','Supplier name',inp('name','text',x.name||'','required'),'full')+field('email','Contact email',inp('email','email',x.email||'','required'))+field('phone','Phone',inp('phone','text',x.phone||''))+field('lead','Quoted lead time (days)',inp('lead','number',x.lead||7,'min="1" step="1" required'))+field('terms','Payment terms (Net days)',inp('terms','number',x.terms??30,'min="0" step="1" required'));}
 if(kind==='import'){title='Import your operational data';submit='Validate & import';content='<div class="info full">Choose one entity and paste a JSON array, or load a JSON file. Imports are validated and committed atomically. Existing IDs update in place.</div>'+field('entity','Data type',select('entity',['suppliers','items','customers','locations','sales']),'full')+field('file','JSON file',inp('file','file','','accept=".json,application/json" onchange="loadImportFile(this)"'),'full')+field('rows','JSON array','<textarea id="rows" name="rows" placeholder=\'[{"id":"…"}]\' required></textarea>','full');}
 $('modal').innerHTML='<div class="modalbg" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="modalhead"><h2>'+title+'</h2><button class="close" onclick="closeModal()" aria-label="Close">×</button></div><form onsubmit="submitModal(event)"><div class="modalbody"><div class="formgrid">'+content+'</div><div id="modalerror"></div></div><div class="modalfoot">'+btn('Cancel','closeModal()')+'<button class="btn primary" type="submit">'+submit+'</button></div></form></section></div>';updateTotal();setTimeout(()=>document.querySelector('#modal input, #modal select')?.focus(),50);
}
function poCart(){return cart.map((x,k)=>'<div class="cartline">'+select('pi'+k,itemOpts(S.items.filter(x=>x.supplier===poSupplier)),x.item,'onchange="cart['+k+'].item=this.value"')+inp('pq'+k,'number',x.qty,'min="1" step="1" onchange="cart['+k+'].qty=Number(this.value)"')+btn('×','cart.splice('+k+',1);document.getElementById(\'pocart\').innerHTML=poCart()')+'</div>').join('')+btn('＋ Add PO line','poAddLine()','light')}
function poAddLine(){const i=S.items.find(x=>x.supplier===poSupplier);if(!i){toast('This supplier has no items. Import an item linked to it.',true);return}cart.push({item:i.id,qty:25});$('pocart').innerHTML=poCart()}function updatePOExpected(){$('poexpected').textContent='Expected receipt: '+addDays(date(),sup(poSupplier).lead)}
function returnItems(){const r=S.sales.find(x=>x.id===$('sale').value);$('item').innerHTML=r.lines.map(x=>'<option value="'+esc(x.item)+'">'+esc(it(x.item).name)+'</option>').join('')}
async function loadImportFile(input){try{$('rows').value=await input.files[0].text()}catch(e){toast('Could not read file',true)}}
async function submitModal(e){e.preventDefault();const kind=currentModal,id=modalId,p=Object.fromEntries(new FormData(e.target));if(id)p.id=id;if(['order','po'].includes(kind))p.lines=cart.map(x=>({...x}));if(kind==='import'){try{p.rows=JSON.parse(p.rows)}catch{$('modalerror').innerHTML='<div class="error">Invalid JSON. Paste an array of records.</div>';return}delete p.file;}
const r=await action(kind,p);if(!r)return;closeModal();renderView();if(kind==='po')poDocument(r.id);if(kind==='return'){toast('Return processed. '+(r.id?'Exchange net amount due (negative = refund): '+money(r.difference):'Refund including tax: '+money(r.refund)))}}
async function action(actionName,payload){if(busy)return null;busy=true;document.querySelectorAll('button[type=submit]').forEach(b=>b.disabled=true);try{let r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:actionName,payload,revision:D.revision})}),d=await r.json();if(!r.ok){if(r.status===409)await refresh(false);throw Error(d.error)}await refresh(false);if(!$('modal').innerHTML)renderView();toast('Saved. Shared inventory and reports updated.');return d.result;}catch(e){let target=$('modalerror')||$('formerror');if(target)target.innerHTML='<div class="error">'+esc(e.message)+'</div>';else toast(e.message,true);return null}finally{busy=false;document.querySelectorAll('button[type=submit]').forEach(b=>b.disabled=false)}}
async function simpleAction(a,p){await action(a,p)}function statusAction(a,id,status){simpleAction(a,{id,status})}
async function saveSettings(e){e.preventDefault();await action('settings',Object.fromEntries(new FormData(e.target)))}async function saveUser(e){e.preventDefault();await action('user',Object.fromEntries(new FormData(e.target)))}
function poDocument(id){const p=S.pos.find(x=>x.id===id),s=sup(p.supplier),body='Purchase Order '+p.id+'\nTextiles Move\nSupplier: '+s.name+'\nSent: '+p.date+'\nExpected: '+p.expected+'\nTerms: Net '+s.terms+'\nDeliver to: '+S.locations[p.location]+'\n\n'+p.lines.map(l=>it(l.item).name+' · '+l.qty+' × '+money(l.cost)).join('\n')+'\n\nTotal: '+money(p.lines.reduce((a,l)=>a+l.qty*l.cost,0));showModal('Purchase order · '+esc(p.id),'<div class="modalbody"><div class="info">Send opens an email draft in your mail app. The app does not send email automatically. Confirm dispatch in your email client.</div><pre class="receipt">'+esc(body)+'</pre></div>','<a class="btn primary" href="mailto:'+esc(s.email)+'?subject='+encodeURIComponent('Textiles Move · '+p.id)+'&body='+encodeURIComponent(body)+'">Open email draft</a>'+btn('Print PO','window.print()'))}
function toast(text,error=false){$('toast').innerHTML='<div class="toast" style="'+(error?'background:#9f5745':'')+'">'+esc(text)+'</div>';setTimeout(()=>$('toast').innerHTML='',4500)}
function downloadJSON(name,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportRows(name,rows){if(!rows.length){toast('No rows to export');return}let keys=[...new Set(rows.flatMap(x=>Object.keys(x)))],csv=[keys,...rows.map(x=>keys.map(k=>typeof x[k]==='object'?JSON.stringify(x[k]):x[k]))].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});refresh();setInterval(async()=>{if(document.hidden||busy||currentModal)return;let editing=document.activeElement?.matches('input,select,textarea');let old=D?.revision;await refresh(false);if(D?.revision!==old&&view!=='pos'&&!editing)renderView()},5000);
</script></body></html>
